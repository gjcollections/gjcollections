backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "catalog"
    label: "Jewellery Catalog"
    files:
      - name: "jewelry"
        label: "All Items"
        file: "data/jewelry.json"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            fields:
              - { label: "Item Name", name: "title", widget: "string" }
              - { label: "Category", name: "category", widget: "select", options: ["Fancy Collection", "Bridal Collection", "Temple Jewellery", "Daily Wear"] }
              - { label: "Jewellery Photo", name: "image", widget: "image" }
              - { label: "Short Description", name: "description", widget: "text" }
